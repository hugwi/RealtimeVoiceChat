<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Spike</title>
<style>body{font-family:sans-serif;max-width:640px;margin:24px auto;padding:0 16px}
button{font-size:18px;padding:14px 28px;border-radius:8px;border:0;background:#2563eb;color:#fff;cursor:pointer}
button:disabled{background:#94a3b8}
#log{margin-top:20px;font-family:monospace;font-size:13px;white-space:pre-wrap;background:#f4f4f5;padding:12px;border-radius:8px;min-height:140px}</style>
</head><body>
<h2>🎙️ Local Voice Agent</h2>
<button id="go">Connect &amp; talk</button>
<button id="stop" disabled style="margin-left:12px;background:#dc2626">Disconnect</button>
<div id="log">Loading livekit-client...</div>
<script src="./livekit-client.umd.min.js" onerror="document.getElementById('log').textContent='❌ livekit-client.umd.min.js failed to load'"></script>
<script>
const TOKEN_URL = 'https://hyggan-system-product-name.tail19f0b5.ts.net:8443/token';
const LK_URL   = 'wss://hyggan-system-product-name.tail19f0b5.ts.net:10000';
const ROOM     = 'voice';

const L = (m) => { document.getElementById('log').textContent += '\n' + m; console.log(m); };
window.onerror = (m,s,l) => L('❌ JS error: ' + m + ' @' + l);

if (window.LivekitClient) { L('✅ livekit-client loaded'); }
else { L('❌ LivekitClient global missing'); }

let room = null;

document.getElementById('go').onclick = async () => {
  document.getElementById('go').disabled = true;
  try {
    L('Fetching token from ' + TOKEN_URL + '...');
    const resp = await fetch(`${TOKEN_URL}?room=${ROOM}&identity=browser-user`);
    if (!resp.ok) throw new Error('Token fetch failed: ' + resp.status);
    const { token } = await resp.json();
    L('✅ got token');

    const { Room, RoomEvent } = LivekitClient;
    room = new Room();

    room.on(RoomEvent.TrackSubscribed, (t) => {
      if (t.kind === 'audio') {
        const el = t.attach();
        el.autoplay = true;
        document.body.appendChild(el);
        L('🔊 agent audio track subscribed');
      }
    });
    room.on(RoomEvent.ConnectionStateChanged, (s) => L('state: ' + s));
    room.on(RoomEvent.Disconnected, (r) => {
      L('disconnected: ' + (r || ''));
      document.getElementById('go').disabled = false;
      document.getElementById('stop').disabled = true;
    });
    room.on(RoomEvent.DataReceived, (payload) => {
      try {
        const msg = JSON.parse(new TextDecoder().decode(payload));
        L('agent state: ' + JSON.stringify(msg));
      } catch {}
    });
    room.on(RoomEvent.ParticipantConnected, (p) => L('participant joined: ' + p.identity));

    L('Connecting to ' + LK_URL + ' ...');
    await room.connect(LK_URL, token);
    L('✅ connected, room=' + room.name);
    await room.localParticipant.setMicrophoneEnabled(true);
    L('🎤 mic live — talk then pause, agent will reply');
    document.getElementById('stop').disabled = false;
  } catch (e) {
    L('❌ ' + (e && e.message ? e.message : e));
    document.getElementById('go').disabled = false;
  }
};

document.getElementById('stop').onclick = async () => {
  document.getElementById('stop').disabled = true;
  if (room) { await room.disconnect(); room = null; }
};
</script></body></html>
