[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocis-core"
version = "0.1.0"
description = "Platform-agnostic Voice Gateway core"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx",
    "pydantic",
    "keyring",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["vocis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
